<title>Strata — Launch Benchmark Results</title>
<style>
  /* ============================================================
     Token system — Strata's own palette (website/styles.css),
     restated here rather than linked (artifacts are self-contained).
     Dark variant is a deliberate, separately-tuned pass, not an
     automatic invert.
     ============================================================ */
  :root {
    --bg: #FAF8F4;
    --surface: #FEFCF8;
    --surface-2: #F4F1EA;
    --border: #E1E3E8;
    --accent: #1E7BB0;       /* steel blue — identity (validated: scripts/validate_palette.js) */
    --accent-ink: #185F87;
    --win: #2E9963;          /* sage green — status: win */
    --win-dim: rgba(46, 153, 99, 0.10);
    --caution: #D68A00;      /* amber — status: decline / caution */
    --caution-dim: rgba(214, 138, 0, 0.10);
    --critical: #C23636;     /* status: invalid / excluded */
    --critical-dim: rgba(194, 54, 54, 0.09);
    --text: #14161B;
    --muted: #6B7483;
    --ink: #070A0F;
    --font-head: -apple-system, "Segoe UI", system-ui, sans-serif;
    --font-body: system-ui, -apple-system, "Segoe UI", sans-serif;
    --font-mono: ui-monospace, "SFMono-Regular", "JetBrains Mono", Menlo, Consolas, monospace;
    --radius: 12px;
    --radius-sm: 8px;
    --maxw: 980px;
  }
  /* Dark variant validated separately (its own light-vs-dark palette pass) — not an automatic
     invert. Critical shifts toward magenta-red rather than orange-red specifically because that
     pairing collides with caution/amber under deuteranopia; magenta-red keeps full separation. */
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0B1420;
      --surface: #101C2C;
      --surface-2: #14263A;
      --border: #223950;
      --accent: #3E93C9;
      --accent-ink: #8FC6E6;
      --win: #3CA574;
      --win-dim: rgba(60, 165, 116, 0.14);
      --caution: #BE8228;
      --caution-dim: rgba(190, 130, 40, 0.14);
      --critical: #D65A9E;
      --critical-dim: rgba(214, 90, 158, 0.14);
      --text: #EBEFF4;
      --muted: #8FA6BC;
      --ink: #F5F8FB;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0B1420; --surface: #101C2C; --surface-2: #14263A; --border: #223950;
    --accent: #3E93C9; --accent-ink: #8FC6E6;
    --win: #3CA574; --win-dim: rgba(60, 165, 116, 0.14);
    --caution: #BE8228; --caution-dim: rgba(190, 130, 40, 0.14);
    --critical: #D65A9E; --critical-dim: rgba(214, 90, 158, 0.14);
    --text: #EBEFF4; --muted: #8FA6BC; --ink: #F5F8FB;
  }
  :root[data-theme="light"] {
    --bg: #FAF8F4; --surface: #FEFCF8; --surface-2: #F4F1EA; --border: #E1E3E8;
    --accent: #1E7BB0; --accent-ink: #185F87;
    --win: #2E9963; --win-dim: rgba(46, 153, 99, 0.10);
    --caution: #D68A00; --caution-dim: rgba(214, 138, 0, 0.10);
    --critical: #C23636; --critical-dim: rgba(194, 54, 54, 0.09);
    --text: #14161B; --muted: #6B7483; --ink: #070A0F;
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; background: var(--bg); color: var(--text);
    font-family: var(--font-body); -webkit-font-smoothing: antialiased;
  }
  body { padding: 40px 20px 80px; }
  .page { max-width: var(--maxw); margin: 0 auto; }

  header.hero { margin-bottom: 40px; }
  .eyebrow {
    font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--accent-ink); margin-bottom: 10px; font-weight: 600;
  }
  h1 {
    font-family: var(--font-head); font-size: clamp(28px, 4vw, 38px); font-weight: 700;
    letter-spacing: -0.01em; margin: 0 0 12px; text-wrap: balance; color: var(--ink);
  }
  .dek { font-size: 16px; color: var(--muted); max-width: 62ch; line-height: 1.55; margin: 0; }

  /* ── Stat tile row ── */
  .stats {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 1px;
    background: var(--border); border: 1px solid var(--border); border-radius: var(--radius);
    overflow: hidden; margin: 32px 0 40px;
  }
  .stat { background: var(--surface); padding: 18px 20px; }
  .stat-label {
    font-family: var(--font-mono); font-size: 10.5px; letter-spacing: 0.07em; text-transform: uppercase;
    color: var(--muted); margin-bottom: 8px;
  }
  .stat-value {
    font-family: var(--font-mono); font-size: 26px; font-weight: 600; font-variant-numeric: tabular-nums;
    color: var(--ink); line-height: 1;
  }
  .stat-value.win { color: var(--win); }
  .stat-value.caution { color: var(--caution); }

  /* ── Task cards ── */
  .task-list { display: flex; flex-direction: column; gap: 14px; }
  .task-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 22px 24px;
  }
  .task-head { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; margin-bottom: 4px; flex-wrap: wrap; }
  .task-name { font-family: var(--font-head); font-size: 18px; font-weight: 600; color: var(--ink); }
  .pill {
    font-family: var(--font-mono); font-size: 10.5px; font-weight: 600; letter-spacing: 0.04em;
    padding: 3px 9px; border-radius: 999px; text-transform: uppercase; white-space: nowrap;
  }
  .pill.win { background: var(--win-dim); color: var(--win); }
  .pill.loss { background: var(--caution-dim); color: var(--caution); }
  .pill.invalid { background: var(--critical-dim); color: var(--critical); }
  .pill.pending { background: var(--surface-2); color: var(--muted); }

  .task-desc { font-size: 13.5px; color: var(--muted); margin: 4px 0 16px; max-width: 68ch; }

  .bars { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  .metric-label {
    font-family: var(--font-mono); font-size: 10.5px; letter-spacing: 0.06em; text-transform: uppercase;
    color: var(--muted); margin-bottom: 8px;
  }
  .bar-row { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
  .bar-name { font-size: 12px; color: var(--muted); width: 58px; flex-shrink: 0; }
  .bar-track { flex: 1; background: var(--surface-2); border-radius: 4px; height: 20px; position: relative; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 4px; transition: width 0.4s var(--ease, ease); }
  .bar-fill.baseline { background: var(--muted); opacity: 0.55; }
  .bar-fill.strata { background: var(--accent); }
  .bar-value {
    font-family: var(--font-mono); font-size: 12px; font-weight: 600; color: var(--text);
    width: 64px; text-align: right; font-variant-numeric: tabular-nums; flex-shrink: 0;
  }

  .task-meta {
    display: flex; gap: 16px; flex-wrap: wrap; margin-top: 16px; padding-top: 14px;
    border-top: 1px solid var(--border); font-size: 12px; color: var(--muted);
  }
  .task-meta code {
    font-family: var(--font-mono); font-size: 11px; background: var(--surface-2);
    padding: 1px 5px; border-radius: 4px; color: var(--accent-ink);
  }
  .root-cause {
    margin-top: 10px; padding: 10px 12px; background: var(--caution-dim); border-radius: var(--radius-sm);
    font-size: 12.5px; color: var(--text); border-left: 2px solid var(--caution);
  }

  footer {
    margin-top: 48px; padding-top: 20px; border-top: 1px solid var(--border);
    font-size: 12.5px; color: var(--muted); line-height: 1.6; max-width: 68ch;
  }
  footer a { color: var(--accent-ink); }
</style>

<div class="page">
  <header class="hero">
    <div class="eyebrow">Strata — launch benchmark</div>
    <h1>Does Strata actually help, and where does it not?</h1>
    <p class="dek" id="dek">Loading results…</p>
  </header>

  <div class="stats" id="stats"></div>
  <div class="task-list" id="tasks"></div>

  <footer id="footer"></footer>
</div>

<script>
// ── DATA — replace with real benchmark/runs/exp-launch/SUMMARY.json content ──
const DATA = window.__STRATA_LAUNCH_DATA__ || { generatedAt: null, rows: [], validStrataRuns: 0, invalidStrataRuns: 0, hubComposedRate: null, totalRuns: 0 };

const TASK_DESC = {
  catalog: 'Pagination + per-IP rate limiting + request logging on an existing Express API. Strata\'s proven multi-recall composition case.',
  idempotency: 'Idempotency-key order creation + request validation + attempt logging — this week\'s most forensically-tracked task; also the live test of the mountWiring fix.',
  stripejune: 'A Stripe payment flow, built from nothing. Payments is a historically hard domain for Strata — capable models tend to audit and rewrite delivered code here.',
  retry: 'One small retry helper. A known, deliberate loss case — below Strata\'s own break-even point. Included on purpose: the honest story includes where Strata correctly declines.',
};

function fmtPct(p) {
  if (p == null) return '—';
  const sign = p > 0 ? '+' : '';
  return sign + p + '%';
}

function renderStats(d) {
  const el = document.getElementById('stats');
  const wins = d.rows.filter(r => r.verdict === 'WIN').length;
  const tiles = [
    ['Tasks tested', d.rows.length],
    ['Strata wins', wins, wins > 0 ? 'win' : ''],
    ['Valid strata runs', d.validStrataRuns + ' / ' + (d.validStrataRuns + d.invalidStrataRuns)],
    ['Hub-composed', d.hubComposedRate != null ? d.hubComposedRate + '%' : '—'],
  ];
  el.innerHTML = tiles.map(([label, value, cls]) =>
    '<div class="stat"><div class="stat-label">' + label + '</div><div class="stat-value ' + (cls||'') + '">' + value + '</div></div>'
  ).join('');
}

function renderTask(row) {
  const b = row.baseline, s = row.strata;
  const verdictClass = row.verdict === 'WIN' ? 'win' : row.verdict === 'INVALID — excluded' ? 'invalid' : row.verdict === 'no strata run' ? 'pending' : 'loss';
  const verdictLabel = row.verdict === 'WIN' ? 'Strata wins' : row.verdict === 'INVALID — excluded' ? 'Invalid — excluded' : row.verdict === 'no strata run' ? 'Pending' : 'Loss (honest)';

  const maxTurns = Math.max(b?.turns || 0, s?.turns || 0, 1);
  const maxCost = Math.max(b?.costUsd || 0, s?.costUsd || 0, 0.01);

  const bar = (label, value, max, cls) => value == null ? '' :
    '<div class="bar-row"><div class="bar-name">' + label + '</div><div class="bar-track"><div class="bar-fill ' + cls + '" style="width:' + Math.max(4, (value/max)*100) + '%"></div></div><div class="bar-value">' + value + '</div></div>';

  const barCost = (label, value, max, cls) => value == null ? '' :
    '<div class="bar-row"><div class="bar-name">' + label + '</div><div class="bar-track"><div class="bar-fill ' + cls + '" style="width:' + Math.max(4, (value/max)*100) + '%"></div></div><div class="bar-value">$' + value.toFixed(2) + '</div></div>';

  const meta = [];
  if (s) {
    meta.push('<span>turns ' + fmtPct(row.turnsDeltaPct) + '</span>');
    meta.push('<span>cost ' + fmtPct(row.costDeltaPct) + '</span>');
    if (s.hubComposed) meta.push('<span>composed <code>on hub</code></span>');
    if (s.deliveredRecalls && s.deliveredRecalls.length) meta.push('<span>' + s.deliveredRecalls.length + ' recalls: <code>' + s.deliveredRecalls.join('</code>, <code>') + '</code></span>');
  }

  return '<div class="task-card">'
    + '<div class="task-head"><div class="task-name">' + row.task + '</div><div class="pill ' + verdictClass + '">' + verdictLabel + '</div></div>'
    + '<div class="task-desc">' + (TASK_DESC[row.task] || '') + '</div>'
    + '<div class="bars">'
    + '<div><div class="metric-label">Turns</div>' + bar('baseline', b?.turns, maxTurns, 'baseline') + bar('strata', s?.turns, maxTurns, 'strata') + '</div>'
    + '<div><div class="metric-label">Cost (USD)</div>' + barCost('baseline', b?.costUsd, maxCost, 'baseline') + barCost('strata', s?.costUsd, maxCost, 'strata') + '</div>'
    + '</div>'
    + (meta.length ? '<div class="task-meta">' + meta.join('') + '</div>' : '')
    + (row.rootCause ? '<div class="root-cause">' + row.rootCause + '</div>' : '')
    + '</div>';
}

function render() {
  const d = DATA;
  document.getElementById('dek').textContent = d.rows.length
    ? 'Real agent sessions, Haiku, ' + d.rows.length + ' tasks, hub-mode composition. Invalid runs (tool never called) are excluded from every number below, not averaged in.'
    : 'No data yet — run benchmark/analyze-launch.js and inject SUMMARY.json as window.__STRATA_LAUNCH_DATA__.';
  renderStats(d);
  document.getElementById('tasks').innerHTML = d.rows.map(renderTask).join('') || '<p style="color:var(--muted)">Waiting on benchmark data.</p>';
  document.getElementById('footer').innerHTML =
    'Methodology: identical prompt in both arms; the only difference is whether Strata\'s MCP server is present. '
    + 'A strata-arm run where <code style="font-family:var(--font-mono)">strata_use</code> was never called is recorded as invalid and excluded from every average — it is a second baseline by omission, not a slower measurement. '
    + (d.generatedAt ? 'Generated ' + new Date(d.generatedAt).toLocaleString() + '.' : '');
}
render();
</script>
