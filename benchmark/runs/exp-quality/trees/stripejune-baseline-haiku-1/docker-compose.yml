version: '3.8'

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "1025:1025"
      - "8025:8025"
    environment:
      MH_SMTP_BIND_ADDR: 0.0.0.0:1025
      MH_UI_WEB_PATH: /

volumes:
  redis_data:
