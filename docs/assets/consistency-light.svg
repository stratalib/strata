<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 368" width="760" height="368" role="img" aria-label="Quality of every individual run, three runs per arm per task. Without Strata the results scatter — on idempotency 14%, 71% and 71%. With Strata every run of a task lands on the same score.">
  <rect width="760" height="368" fill="#FFFFFF"/>
  <text x="12" y="26" fill="#17191B" font-size="14" font-weight="600" font-family="ui-monospace,monospace">Every run, not the average — haiku, 3 runs per arm</text>
  <text x="12" y="44" fill="#5C6469" font-size="11" font-family="ui-monospace,monospace">each dot is one run · the bar is the spread between best and worst</text>
  <circle cx="546" cy="22" r="5.5" fill="#B8622E" stroke="#FFFFFF" stroke-width="2"/>
  <text x="558" y="26" fill="#5C6469" font-size="10.5" font-family="ui-monospace,monospace">no Strata</text>
  <circle cx="620" cy="22" r="5.5" fill="#2A7FA8" stroke="#FFFFFF" stroke-width="2"/>
  <text x="632" y="26" fill="#5C6469" font-size="10.5" font-family="ui-monospace,monospace">Strata</text>
  <line x1="132.0" y1="52" x2="132.0" y2="322" stroke="rgba(17,17,18,0.07)" stroke-width="1"/>
  <text x="132.0" y="338" text-anchor="middle" fill="#5C6469" font-size="10.5" font-family="ui-monospace,monospace">0%</text>
  <line x1="265.0" y1="52" x2="265.0" y2="322" stroke="rgba(17,17,18,0.07)" stroke-width="1"/>
  <text x="265.0" y="338" text-anchor="middle" fill="#5C6469" font-size="10.5" font-family="ui-monospace,monospace">25%</text>
  <line x1="398.0" y1="52" x2="398.0" y2="322" stroke="rgba(17,17,18,0.07)" stroke-width="1"/>
  <text x="398.0" y="338" text-anchor="middle" fill="#5C6469" font-size="10.5" font-family="ui-monospace,monospace">50%</text>
  <line x1="531.0" y1="52" x2="531.0" y2="322" stroke="rgba(17,17,18,0.07)" stroke-width="1"/>
  <text x="531.0" y="338" text-anchor="middle" fill="#5C6469" font-size="10.5" font-family="ui-monospace,monospace">75%</text>
  <line x1="664.0" y1="52" x2="664.0" y2="322" stroke="rgba(17,17,18,0.07)" stroke-width="1"/>
  <text x="664.0" y="338" text-anchor="middle" fill="#5C6469" font-size="10.5" font-family="ui-monospace,monospace">100%</text>
  <text x="120" y="70.0" text-anchor="end" fill="#17191B" font-size="12" font-weight="600" font-family="ui-monospace,monospace">catalog</text>
  <text x="132" y="70.0" fill="#5C6469" font-size="10.5" font-family="ui-monospace,monospace">pagination · rate limit · logging</text>
  <rect x="464.5" y="85.0" width="66.5" height="6" rx="3" fill="#B8622E" opacity="0.22"/><circle cx="464.5" cy="88.0" r="5.5" fill="#B8622E" stroke="#FFFFFF" stroke-width="2"/><circle cx="531.0" cy="88.0" r="5.5" fill="#B8622E" stroke="#FFFFFF" stroke-width="2"/><text x="541.0" y="91.5" text-anchor="start" fill="#5C6469" font-size="9.5" font-family="ui-monospace,monospace">×2</text><text x="120" y="92.0" text-anchor="end" fill="#5C6469" font-size="11" font-family="ui-monospace,monospace">no Strata</text><text x="676" y="92.0" fill="#17191B" font-size="11" font-family="ui-monospace,monospace">71% <tspan fill="#5C6469">±6</tspan></text>
  <rect x="664.0" y="113.0" width="2.0" height="6" rx="3" fill="#2A7FA8" opacity="0.22"/><circle cx="664.0" cy="116.0" r="5.5" fill="#2A7FA8" stroke="#FFFFFF" stroke-width="2"/><text x="654.0" y="119.5" text-anchor="end" fill="#5C6469" font-size="9.5" font-family="ui-monospace,monospace">×3</text><text x="120" y="120.0" text-anchor="end" fill="#5C6469" font-size="11" font-family="ui-monospace,monospace">Strata</text><text x="676" y="120.0" fill="#17191B" font-size="11" font-family="ui-monospace,monospace">100% <tspan fill="#5C6469">exact</tspan></text>
  <text x="120" y="154.0" text-anchor="end" fill="#17191B" font-size="12" font-weight="600" font-family="ui-monospace,monospace">idempotency</text>
  <text x="132" y="154.0" fill="#5C6469" font-size="10.5" font-family="ui-monospace,monospace">idempotent order creation</text>
  <rect x="208.0" y="169.0" width="304.0" height="6" rx="3" fill="#B8622E" opacity="0.22"/><circle cx="208.0" cy="172.0" r="5.5" fill="#B8622E" stroke="#FFFFFF" stroke-width="2"/><circle cx="512.0" cy="172.0" r="5.5" fill="#B8622E" stroke="#FFFFFF" stroke-width="2"/><text x="522.0" y="175.5" text-anchor="start" fill="#5C6469" font-size="9.5" font-family="ui-monospace,monospace">×2</text><text x="120" y="176.0" text-anchor="end" fill="#5C6469" font-size="11" font-family="ui-monospace,monospace">no Strata</text><text x="676" y="176.0" fill="#17191B" font-size="11" font-family="ui-monospace,monospace">52% <tspan fill="#5C6469">±29</tspan></text>
  <rect x="664.0" y="197.0" width="2.0" height="6" rx="3" fill="#2A7FA8" opacity="0.22"/><circle cx="664.0" cy="200.0" r="5.5" fill="#2A7FA8" stroke="#FFFFFF" stroke-width="2"/><text x="654.0" y="203.5" text-anchor="end" fill="#5C6469" font-size="9.5" font-family="ui-monospace,monospace">×3</text><text x="120" y="204.0" text-anchor="end" fill="#5C6469" font-size="11" font-family="ui-monospace,monospace">Strata</text><text x="676" y="204.0" fill="#17191B" font-size="11" font-family="ui-monospace,monospace">100% <tspan fill="#5C6469">exact</tspan></text>
  <text x="120" y="238.0" text-anchor="end" fill="#17191B" font-size="12" font-weight="600" font-family="ui-monospace,monospace">stripejune</text>
  <text x="132" y="238.0" fill="#5C6469" font-size="10.5" font-family="ui-monospace,monospace">stripe webhooks · queue · receipts</text>
  <rect x="132.0" y="253.0" width="266.0" height="6" rx="3" fill="#B8622E" opacity="0.22"/><circle cx="132.0" cy="256.0" r="5.5" fill="#B8622E" stroke="#FFFFFF" stroke-width="2"/><text x="142.0" y="259.5" text-anchor="start" fill="#5C6469" font-size="9.5" font-family="ui-monospace,monospace">×2</text><circle cx="398.0" cy="256.0" r="5.5" fill="#B8622E" stroke="#FFFFFF" stroke-width="2"/><text x="120" y="260.0" text-anchor="end" fill="#5C6469" font-size="11" font-family="ui-monospace,monospace">no Strata</text><text x="676" y="260.0" fill="#17191B" font-size="11" font-family="ui-monospace,monospace">17% <tspan fill="#5C6469">±25</tspan></text>
  <rect x="132.0" y="281.0" width="532.0" height="6" rx="3" fill="#2A7FA8" opacity="0.22"/><circle cx="132.0" cy="284.0" r="5.5" fill="#2A7FA8" stroke="#FFFFFF" stroke-width="2"/><circle cx="664.0" cy="284.0" r="5.5" fill="#2A7FA8" stroke="#FFFFFF" stroke-width="2"/><text x="654.0" y="287.5" text-anchor="end" fill="#5C6469" font-size="9.5" font-family="ui-monospace,monospace">×2</text><text x="120" y="288.0" text-anchor="end" fill="#5C6469" font-size="11" font-family="ui-monospace,monospace">Strata</text><text x="676" y="288.0" fill="#17191B" font-size="11" font-family="ui-monospace,monospace">67% <tspan fill="#5C6469">±50</tspan></text>
  <text x="12" y="356" fill="#5C6469" font-size="10" font-family="ui-monospace,monospace">catalog measured before a later prompt change that applies to both arms; the spread it shows is unaffected.</text>
</svg>
